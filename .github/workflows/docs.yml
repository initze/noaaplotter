# Deploy the noaaplotter docs to GitHub Pages.
#
#  Jobs:
#   docs    — install the package + .[docs] extra, run `mkdocs build --strict`,
#             and assert the expected pages exist. This is the CI gate: it runs
#             on every PR and push to master, so a broken docs build fails review.
#   deploy  — publishes the built `site/` with the official GitHub Pages actions
#             (configure-pages / upload-pages-artifact / deploy-pages). No
#             `gh-pages` branch is written; Pages serves the Actions artifact
#             (Settings → Pages → Source: "GitHub Actions").
#
#  The canonical URL is https://initze.github.io/noaaplotter/ (see `site_url`
#  in mkdocs.yml and the "Documentation" link in pyproject.toml).
#
#  Release hook: `create-release` pushes its version bump with GITHUB_TOKEN,
#  and such pushes do NOT trigger other workflows (GitHub's recursion guard).
#  The `workflow_run` trigger below re-builds and re-deploys the docs after a
#  release completes, so the published site matches the released version.
#
#  Local:
#      uv venv --python 3.11 && uv pip install ".[docs]"
#      uv run mkdocs serve            # live reload on http://127.0.0.1:8000
#      uv run mkdocs build --strict   # one-shot strict build
#
#  After changing CLI options, regenerate the CLI reference:
#      uv run python scripts/gen_cli_docs.py

name: docs

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Re-deploy after a release, whose GITHUB_TOKEN push cannot trigger us.
  workflow_run:
    workflows: ["create-release"]
    types: [completed]

# Default least privilege; the deploy job adds the Pages scopes it needs.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  docs:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install package + docs extra
      run: |
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Build (strict)
      run: |
        . .venv/bin/activate
        python scripts/gen_cli_docs.py
        mkdocs build --strict --site-dir site
    - name: Verify all expected pages
      run: |
        for page in index cli api getting-started examples changelog license rolling_sum 404; do
          test -f "site/${page}/index.html" || test -f "site/${page}.html"
        done
        test -f site/search/search_index.json
        test -f site/figures/kotzebue_daily_1992.png
        test -f site/figures/kotzebue_monthly_t.png
        # live interactive examples (embedded in the Examples page)
        test -f site/interactive/kotzebue_daily_1992.html
        test -f site/interactive/potsdam_era5_daily.html
        test -f site/interactive/kotzebue_daily_winter.html
        echo "all expected pages + search index + figures + interactive examples present"
    - name: Upload site (for deploy job)
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site
        retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: docs
    # push to master, or a successful create-release run
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize deploys only (PR builds stay independent).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write       # publish the artifact to Pages
      id-token: write    # OIDC token required by deploy-pages
    steps:
    - name: Download built site
      uses: actions/download-artifact@v4
      with:
        name: docs-site
        path: site
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
